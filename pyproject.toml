[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seekho-dataset-downloader"
version = "1.0.0"
description = "Download and refine Seekho analytics CSV with camelCase columns and adCreative parsing."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
seekho-dataset = "seekho_downloader.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
